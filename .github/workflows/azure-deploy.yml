name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_NAME: gateway-api-wltn9
  AZURE_WEBAPP_NAME_UI: gateway-ui-wltn9

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gateway
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Gateway.sln

    - name: Build
      run: dotnet build Gateway.sln --configuration Release --no-restore

    - name: Publish API
      run: dotnet publish src/Gateway.Api/Gateway.Api.csproj --configuration Release --output ./publish/api

    - name: Publish UI
      run: dotnet publish src/Gateway.Ui/Gateway.Ui.csproj --configuration Release --output ./publish/ui

    - name: Upload API artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-artifacts
        path: ./publish/api

    - name: Upload UI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ui-artifacts
        path: ./publish/ui

  deploy-api:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: Production
    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Download API artifacts
      uses: actions/download-artifact@v4
      with:
        name: api-artifacts
        path: ./publish/api

    - name: Set Azure App Service environment variables
      run: |
        az webapp config appsettings set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --settings \
            ASPNETCORE_ENVIRONMENT=Production \
            ConnectionStrings__DefaultConnection="${{ secrets.AZURE_POSTGRESQL_CONNECTION_STRING }}"

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ./publish/api

  deploy-ui:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: Production
    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Download UI artifacts
      uses: actions/download-artifact@v4
      with:
        name: ui-artifacts
        path: ./publish/ui

    - name: Set Azure App Service environment variables for UI
      run: |
        az webapp config appsettings set \
          --name ${{ env.AZURE_WEBAPP_NAME_UI }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --settings \
            ASPNETCORE_ENVIRONMENT=Production \
            GatewayApi__BaseUrl="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

    - name: Deploy to Azure Web App
      id: deploy-to-webapp-ui
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME_UI }}
        package: ./publish/ui
