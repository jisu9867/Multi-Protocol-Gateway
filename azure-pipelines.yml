# Azure Pipelines CI/CD

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotNetFramework: 'net8.0'
  dockerRegistryServiceConnection: 'DockerHub' # Update with your Docker registry service connection
  imageRepository: 'gateway'
  containerRegistry: 'ghcr.io' # GitHub Container Registry
  dockerfilePath: '$(Build.SourcesDirectory)'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: Build
    displayName: 'Build Solution'
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore packages'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build solution'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Run tests'
      inputs:
        command: 'test'
        projects: '**/*Tests/**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage"'
      continueOnError: true

    - task: DotNetCoreCLI@2
      displayName: 'Publish API'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/Gateway.Api/Gateway.Api.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api'
        zipAfterPublish: false

    - task: DotNetCoreCLI@2
      displayName: 'Publish UI'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/Gateway.Ui/Gateway.Ui.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/ui'
        zipAfterPublish: false

    - task: PublishBuildArtifacts@1
      displayName: 'Publish API artifacts'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/api'
        artifactName: 'api'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish UI artifacts'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/ui'
        artifactName: 'ui'

- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployAPI
    displayName: 'Deploy API to Azure App Service'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy API to Azure'
            inputs:
              azureSubscription: 'Azure-Connection' # Update with your Azure subscription
              appName: 'gateway-api' # Update with your App Service name
              package: '$(Pipeline.Workspace)/api'

  - deployment: DeployUI
    displayName: 'Deploy UI to Azure App Service'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy UI to Azure'
            inputs:
              azureSubscription: 'Azure-Connection' # Update with your Azure subscription
              appName: 'gateway-ui' # Update with your App Service name
              package: '$(Pipeline.Workspace)/ui'

