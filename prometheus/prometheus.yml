# Prometheus configuration for Gateway observability
global:
  scrape_interval: 15s # Scrape targets every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'gateway-docker'
    environment: 'docker'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Gateway API metrics endpoint (OpenTelemetry Prometheus exporter)
  # All metrics (standard + custom) are exposed via this single endpoint
  - job_name: 'gateway-api'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8080']
        labels:
          service: 'gateway-api'
          component: 'api'
          metrics_type: 'opentelemetry'

  # PostgreSQL exporter (optional - if you add postgres_exporter)
  # - job_name: 'postgresql'
  #   scrape_interval: 30s
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'postgresql'
  #         component: 'database'

